<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trail Timing — Classement</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green:   #16a34a;
      --gold:    #f59e0b;
      --silver:  #94a3b8;
      --bronze:  #b45309;
      --bg:      #0f172a;
      --card:    #1e293b;
      --border:  #334155;
      --text:    #f1f5f9;
      --muted:   #94a3b8;
      --accent:  #22d3ee;
      --gold:    #f59e0b;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
      border-bottom: 2px solid var(--accent);
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header-left h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -.02em;
    }
    .header-left h1 span { color: var(--accent); }
    .header-sub { font-size: .85rem; color: var(--muted); margin-top: 2px; }

    #refresh-info {
      font-size: .78rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #refresh-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; }
      50%      { opacity: .3; }
    }

    /* ── Onglets courses ── */
    #tabs {
      display: flex;
      gap: 8px;
      padding: 16px 24px 0;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }
    .tab {
      padding: 10px 20px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      margin-bottom: -1px;
      white-space: nowrap;
      transition: color .2s;
    }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab:hover:not(.active) { color: var(--text); }
    .tab-badge {
      display: inline-block;
      background: var(--border);
      color: var(--muted);
      font-size: .7rem;
      padding: 1px 7px;
      border-radius: 99px;
      margin-left: 6px;
      vertical-align: middle;
    }
    .tab.active .tab-badge { background: var(--accent); color: var(--bg); }

    /* ── Filtres ── */
    #filters {
      padding: 14px 24px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    #search-input {
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      color: var(--text);
      font-size: .9rem;
      width: 200px;
    }
    #search-input::placeholder { color: var(--muted); }
    #search-input:focus { outline: none; border-color: var(--accent); }

    .filter-btn {
      padding: 7px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      color: var(--muted);
      font-size: .85rem;
      cursor: pointer;
      transition: all .15s;
    }
    .filter-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(34,211,238,.1); }

    #course-info {
      margin-left: auto;
      font-size: .82rem;
      color: var(--muted);
    }

    /* ── Tableau ── */
    #table-wrap {
      padding: 0 24px 40px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .9rem;
    }
    thead th {
      padding: 10px 12px;
      text-align: left;
      font-size: .72rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    tbody tr {
      border-bottom: 1px solid rgba(255,255,255,.04);
      transition: background .15s;
    }
    tbody tr:hover { background: rgba(255,255,255,.04); }
    tbody tr.new-entry {
      animation: highlight .8s ease-out;
    }
    @keyframes highlight {
      from { background: rgba(34,211,238,.2); }
      to   { background: transparent; }
    }

    td { padding: 11px 12px; vertical-align: middle; }

    /* Position */
    .td-pos {
      width: 52px;
      text-align: center;
      font-weight: 800;
      font-size: 1rem;
    }
    .medal {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: .9rem;
      font-weight: 800;
    }
    .medal-1 { background: #fef3c7; color: #92400e; }
    .medal-2 { background: #f1f5f9; color: #475569; }
    .medal-3 { background: #fef3c7; color: var(--bronze); }

    /* Dossard */
    .td-dossard {
      width: 70px;
      font-weight: 700;
      color: var(--muted);
      font-size: .85rem;
    }

    /* Nom */
    .td-nom .full-name { font-weight: 700; font-size: .95rem; }
    .td-nom .club      { font-size: .75rem; color: var(--muted); margin-top: 1px; }

    /* Catégorie */
    .td-cat {
      width: 80px;
    }
    .cat-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: .72rem;
      font-weight: 700;
      background: var(--border);
      color: var(--muted);
    }

    /* Sexe */
    .td-sexe { width: 50px; text-align: center; font-size: .85rem; color: var(--muted); }

    /* Temps */
    .td-temps {
      width: 110px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent);
    }

    /* ── États ── */
    #state-msg {
      padding: 60px 24px;
      text-align: center;
      color: var(--muted);
    }
    #state-msg .icon { font-size: 3rem; margin-bottom: 12px; }
    #state-msg p { font-size: 1.1rem; }

    /* ── Podium (top 3) ── */
    #podium {
      display: none;
      padding: 24px 24px 0;
      gap: 12px;
      justify-content: center;
      align-items: flex-end;
    }
    #podium.visible { display: flex; }
    .podium-block {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 12px 12px;
      text-align: center;
      flex: 1;
      max-width: 160px;
    }
    .podium-block.p1 { border-color: var(--gold); max-width: 180px; }
    .podium-block .p-medal { font-size: 2rem; }
    .podium-block .p-nom { font-size: .85rem; font-weight: 700; margin-top: 6px; }
    .podium-block .p-dossard { font-size: .72rem; color: var(--muted); }
    .podium-block .p-temps { font-family: monospace; font-size: .9rem; color: var(--accent); margin-top: 4px; }

    /* ── Compteurs sidebar-like ── */
    #stats-bar {
      display: flex;
      gap: 16px;
      padding: 14px 24px;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .stat-item { font-size: .82rem; color: var(--muted); }
    .stat-item strong { color: var(--text); font-weight: 700; }

    /* ── Responsive ── */
    /* ── Onglets années ── */
    #annee-tabs {
      display: flex;
      gap: 6px;
      padding: 12px 24px 0;
      align-items: center;
    }
    .annee-label {
      font-size: .72rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      margin-right: 4px;
    }
    .annee-btn {
      padding: 5px 14px;
      border: none;
      background: var(--border);
      color: var(--muted);
      font-size: .82rem;
      font-weight: 700;
      border-radius: 99px;
      cursor: pointer;
      transition: all .15s;
    }
    .annee-btn.active {
      background: var(--gold, #f59e0b);
      color: #fff;
    }
    .annee-btn:hover:not(.active) { background: #475569; color: #fff; }

    @media (max-width: 600px) {
      header { padding: 14px 16px; }
      #tabs  { padding: 12px 16px 0; }
      #filters, #table-wrap, #stats-bar { padding-left: 16px; padding-right: 16px; }
      #search-input { width: 140px; }
      .td-cat, .td-sexe { display: none; }
      .td-nom .club { display: none; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>🏔 Trail <span>des Plancatges</span></h1>
    <div class="header-sub">Classement en direct</div>
  </div>
  <div id="refresh-info">
    <div id="refresh-dot"></div>
    <span id="refresh-label">Mise à jour dans <strong id="countdown">15</strong>s</span>
  </div>
</header>

<!-- Onglets années -->
<div id="annee-tabs"></div>
<!-- Onglets courses -->
<div id="tabs"></div>

<!-- Stats rapides -->
<div id="stats-bar">
  <div class="stat-item">Arrivés : <strong id="stat-arrives">—</strong></div>
  <div class="stat-item">Inscrits : <strong id="stat-inscrits">—</strong></div>
  <div class="stat-item">Statut : <strong id="stat-statut">—</strong></div>
  <div class="stat-item" id="stat-dernier-wrap" style="display:none">
    Dernier : <strong id="stat-dernier">—</strong>
  </div>
</div>

<!-- Filtres -->
<div id="filters">
  <input type="search" id="search-input" placeholder="🔍 Nom, dossard…" />
  <button class="filter-btn active" data-filter="all">Tous</button>
  <button class="filter-btn" data-filter="M">Hommes</button>
  <button class="filter-btn" data-filter="F">Femmes</button>
  <span id="course-info"></span>
  <button id="btn-print-pdf" class="filter-btn" onclick="ouvrirPDF()" title="Exporter en PDF">📄 PDF</button>
</div>

<!-- Podium (masqué si < 3 arrivées) -->
<div id="podium"></div>

<!-- Tableau -->
<div id="table-wrap">
  <div id="state-msg">
    <div class="icon">⏳</div>
    <p>Chargement du classement…</p>
  </div>
  <table id="classement-table" style="display:none">
    <thead>
      <tr>
        <th class="td-pos">Pos.</th>
        <th class="td-dossard">#</th>
        <th>Coureur</th>
        <th class="td-cat">Catég.</th>
        <th class="td-sexe">Sexe</th>
        <th class="td-temps">Temps</th>
        <th class="td-temps">Moyenne</th>
      </tr>
    </thead>
    <tbody id="classement-body"></tbody>
  </table>
</div>

<script>
// ─── État ─────────────────────────────────────────────────────────────────────
const state = {
  annees:       [],
  selectedAnnee: null,
  courses:      [],
  courseId:     null,
  classement:   [],
  filter:       'all',
  searchTerm:   '',
  countdownVal: 15,
  countdownTimer: null,
  refreshTimer:   null,
  prevDossards:   new Set(),
};

// ─── DOM ──────────────────────────────────────────────────────────────────────
const anneTabsEl    = document.getElementById('annee-tabs');
const tabsEl       = document.getElementById('tabs');
const tableEl      = document.getElementById('classement-table');
const bodyEl       = document.getElementById('classement-body');
const stateMsgEl   = document.getElementById('state-msg');
const podiumEl     = document.getElementById('podium');
const searchInput  = document.getElementById('search-input');
const courseInfoEl = document.getElementById('course-info');
const statArrivesEl  = document.getElementById('stat-arrives');
const statInscritsEl = document.getElementById('stat-inscrits');
const statStatutEl   = document.getElementById('stat-statut');
const statDernierEl  = document.getElementById('stat-dernier');
const statDernierWrap = document.getElementById('stat-dernier-wrap');
const countdownEl  = document.getElementById('countdown');

// ─── Init ────────────────────────────────────────────────────────────────────
(async function init() {
  // Lire courseId et annee depuis l'URL (?course=2&annee=2025)
  const params = new URLSearchParams(location.search);
  if (params.get('course')) state.courseId = Number(params.get('course'));
  if (params.get('annee'))  state.selectedAnnee = Number(params.get('annee'));
  await loadAnnees();
  await loadCourses();
  await loadClassement();
  startCountdown();

  // Filtres sexe
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.filter = btn.dataset.filter;
      renderTable();
    });
  });

  searchInput.addEventListener('input', () => {
    state.searchTerm = searchInput.value.trim().toLowerCase();
    renderTable();
  });
})();

// ─── Courses ─────────────────────────────────────────────────────────────────
async function loadAnnees() {
  try {
    const res = await fetch('/api/annees');
    if (!res.ok) return;
    state.annees = await res.json(); // trié décroissant [2026, 2025, ...]
    if (!state.selectedAnnee && state.annees.length > 0) {
      state.selectedAnnee = state.annees[0];
    }
  } catch { /* silencieux */ }
  renderAnneeTabs();
}

function renderAnneeTabs() {
  if (state.annees.length <= 1) {
    anneTabsEl.innerHTML = '';
    return;
  }
  anneTabsEl.innerHTML =
    '<span class="annee-label">\u00c9dition\u00a0:</span>' +
    state.annees.map(a =>
      `<button class="annee-btn ${a === state.selectedAnnee ? 'active' : ''}" data-annee="${a}">${a}</button>`
    ).join('');
  anneTabsEl.querySelectorAll('.annee-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      state.selectedAnnee = Number(btn.dataset.annee);
      state.courseId      = null;
      state.prevDossards.clear();
      renderAnneeTabs();
      await loadCourses();
      await loadClassement();
      resetCountdown();
    });
  });
}

async function loadCourses() {
  try {
    const url = state.selectedAnnee
      ? `/api/courses?annee=${state.selectedAnnee}`
      : '/api/courses';
    const res = await fetch(url);
    state.courses = await res.json();
  } catch { return; }
  if (!state.courseId) {
    const encours = state.courses.find(c => c.statut === 'en_cours');
    state.courseId = (encours || state.courses[0])?.id ?? 1;
  }
  renderTabs();
}


function renderTabs() {
  tabsEl.innerHTML = state.courses.map(c => {
    const statuts = { attente: '⏳', en_cours: '🟢', terminee: '🏁' };
    return `<button class="tab ${c.id === state.courseId ? 'active' : ''}"
                    data-id="${c.id}">
              ${statuts[c.statut] || ''} ${c.nom}
              <span class="tab-badge">${c.nb_arrives}</span>
            </button>`;
  }).join('');

  tabsEl.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      state.courseId = Number(btn.dataset.id);
      state.prevDossards.clear();
      renderTabs();
      loadClassement();
      resetCountdown();
    });
  });
}

// ─── Classement ──────────────────────────────────────────────────────────────
async function loadClassement() {
  try {
    const res  = await fetch(`/api/classement/${state.courseId}`);
    const data = await res.json();

    const course = data.course;
    state.classement = data.classement ?? [];

    // Stats bar
    const coursTrouve = state.courses.find(c => c.id === state.courseId);
    statArrivesEl.textContent  = state.classement.length;
    statInscritsEl.textContent = coursTrouve?.nb_inscrits ?? '—';
    const labels = { attente: 'Pas démarrée', en_cours: 'En cours 🟢', terminee: 'Terminée 🏁' };
    statStatutEl.textContent   = labels[course.statut] ?? course.statut;

    if (state.classement.length > 0) {
      const dernier = state.classement[state.classement.length - 1];
      statDernierEl.textContent = `#${dernier.dossard} ${dernier.prenom} ${dernier.nom} — ${dernier.temps_brut}`;
      statDernierWrap.style.display = '';
    }

    if (course.heure_depart) {
      const depart = new Date(course.heure_depart);
      courseInfoEl.textContent = `Départ : ${depart.toLocaleTimeString('fr-FR', {hour:'2-digit',minute:'2-digit'})}`;
    } else {
      courseInfoEl.textContent = '';
    }

    renderPodium();
    renderTable();

  } catch (e) {
    showStateMsg('❌', 'Erreur de chargement. Vérifiez la connexion.');
  }
}

// ─── Podium ───────────────────────────────────────────────────────────────────
function renderPodium() {
  const top3 = state.classement.slice(0, 3);
  if (top3.length < 3) {
    podiumEl.classList.remove('visible');
    podiumEl.innerHTML = '';
    return;
  }

  const medals = ['🥇', '🥈', '🥉'];
  const order  = [1, 0, 2]; // Affichage : 2e, 1er, 3e pour l'effet podium
  podiumEl.innerHTML = order.map(i => {
    const c = top3[i];
    return `<div class="podium-block ${i === 0 ? 'p1' : ''}">
      <div class="p-medal">${medals[i]}</div>
      <div class="p-nom">${escHtml(c.prenom)} ${escHtml(c.nom)}</div>
      <div class="p-dossard">#${c.dossard}</div>
      <div class="p-temps">${c.temps_brut}</div>
    </div>`;
  }).join('');
  podiumEl.classList.add('visible');
}

// ─── Tableau ──────────────────────────────────────────────────────────────────
function renderTable() {
  let rows = [...state.classement];

  // Filtre sexe
  if (state.filter !== 'all') {
    rows = rows.filter(r => r.sexe === state.filter);
    // Recalcule la position dans la catégorie filtrée
    rows = rows.map((r, i) => ({ ...r, position: i + 1 }));
  }

  // Recherche texte
  if (state.searchTerm) {
    rows = rows.filter(r =>
      String(r.dossard).includes(state.searchTerm) ||
      r.nom.toLowerCase().includes(state.searchTerm) ||
      r.prenom.toLowerCase().includes(state.searchTerm) ||
      r.club.toLowerCase().includes(state.searchTerm)
    );
  }

  if (!rows.length) {
    if (state.classement.length === 0) {
      const course = state.courses.find(c => c.id === state.courseId);
      if (course?.statut === 'attente') {
        showStateMsg('🏁', 'La course n\'a pas encore démarré.');
      } else {
        showStateMsg('⏳', 'En attente des premiers coureurs…');
      }
    } else {
      showStateMsg('🔍', 'Aucun résultat pour cette recherche.');
    }
    tableEl.style.display = 'none';
    return;
  }

  stateMsgEl.style.display = 'none';
  tableEl.style.display = 'table';

  const newDossards = new Set(rows.map(r => r.dossard));

  bodyEl.innerHTML = rows.map(r => {
    const isNew = !state.prevDossards.has(r.dossard) && state.prevDossards.size > 0;
    const posCell = r.position <= 3
      ? `<span class="medal medal-${r.position}">${r.position}</span>`
      : `<strong>${r.position}</strong>`;

    return `<tr class="${isNew ? 'new-entry' : ''}">
      <td class="td-pos">${posCell}</td>
      <td class="td-dossard">${r.dossard}</td>
      <td class="td-nom">
        <div class="full-name">${escHtml(r.prenom)} ${escHtml(r.nom)}</div>
        ${r.club ? `<div class="club">${escHtml(r.club)}</div>` : ''}
      </td>
      <td class="td-cat"><span class="cat-badge">${escHtml(r.categorie) || '—'}</span></td>
      <td class="td-sexe">${r.sexe === 'F' ? '♀' : '♂'}</td>
      <td class="td-temps">${r.temps_brut}</td>
      <td class="td-temps" style="color:var(--muted);font-size:.85rem">${r.vitesse_moy ?? '—'}</td>
    </tr>`;
  }).join('');

  state.prevDossards = newDossards;
}

function showStateMsg(icon, text) {
  stateMsgEl.innerHTML = `<div class="icon">${icon}</div><p>${text}</p>`;
  stateMsgEl.style.display = '';
  tableEl.style.display = 'none';
}

// ─── Countdown & refresh auto ─────────────────────────────────────────────────
function startCountdown() {
  state.countdownVal = 15;
  countdownEl.textContent = state.countdownVal;

  clearInterval(state.countdownTimer);
  state.countdownTimer = setInterval(async () => {
    state.countdownVal--;
    countdownEl.textContent = state.countdownVal;
    if (state.countdownVal <= 0) {
      await loadCourses();
      await loadClassement();
      resetCountdown();
    }
  }, 1000);
}

function resetCountdown() {
  clearInterval(state.countdownTimer);
  startCountdown();
}

// ─── Utils ────────────────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ─── Export PDF ───────────────────────────────────────────────────────────────
function ouvrirPDF() {
  const course = state.courses.find(c => c.id === state.courseId);
  const classement = state.classement;
  if (!classement?.length) return alert('Aucune arrivée à exporter.');

  const nom    = course?.nom ?? 'Classement';
  const date   = new Date().toLocaleDateString('fr-FR', { day:'2-digit', month:'long', year:'numeric' });
  const depart = course?.heure_depart
    ? new Date(course.heure_depart).toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' })
    : '—';

  // Appliquer les filtres actifs (sexe + recherche)
  let lignesFiltrees = [...classement];
  if (state.filter !== 'all') {
    lignesFiltrees = lignesFiltrees.filter(r => r.sexe === state.filter);
    lignesFiltrees = lignesFiltrees.map((r, i) => ({ ...r, position: i + 1 }));
  }
  if (state.searchTerm) {
    lignesFiltrees = lignesFiltrees.filter(r =>
      String(r.dossard).includes(state.searchTerm) ||
      r.nom.toLowerCase().includes(state.searchTerm) ||
      r.prenom.toLowerCase().includes(state.searchTerm)
    );
  }

  const filtreLabel = state.filter === 'F' ? ' — Femmes' : state.filter === 'M' ? ' — Hommes' : '';

  const lignesHtml = lignesFiltrees.map(r => {
    const pos = r.position <= 3 ? ['🥇','🥈','🥉'][r.position - 1] + ' ' + r.position : r.position;
    return `<tr>
      <td class="pos">${pos}</td>
      <td class="dossard">${r.dossard}</td>
      <td class="nom">${escHtml(r.nom)} ${escHtml(r.prenom)}</td>
      <td>${escHtml(r.sexe)}</td>
      <td>${escHtml(r.categorie)}</td>
      <td>${escHtml(r.club || '—')}</td>
      <td class="temps">${r.temps_brut}</td>
      <td style="font-family:monospace;font-size:.85rem;color:#64748b;text-align:right">${r.vitesse_moy ?? '—'}</td>
    </tr>`;
  }).join('');

  const html = `<!DOCTYPE html><html lang="fr"><head>
  <meta charset="UTF-8">
  <title>Classement ${escHtml(nom)}${filtreLabel} — Trail des Plancatges</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, Helvetica, sans-serif; font-size: 11pt; color: #000; }
    .header { padding: 16px 20px 12px; border-bottom: 3px solid #16a34a; margin-bottom: 16px; }
    .header h1 { font-size: 20pt; font-weight: 900; color: #15803d; }
    .header h2 { font-size: 14pt; font-weight: 700; margin: 2px 0 6px; }
    .header-meta { display: flex; gap: 24px; font-size: 9pt; color: #555; }
    .header-meta strong { color: #000; }
    table { width: 100%; border-collapse: collapse; font-size: 9.5pt; }
    thead tr { background: #15803d; color: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    thead th { padding: 7px 8px; text-align: left; font-weight: 700; font-size: 8.5pt; text-transform: uppercase; }
    tbody tr { border-bottom: 1px solid #e2e8f0; }
    tbody tr:nth-child(even) { background: #f8fafc; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    td { padding: 5px 8px; vertical-align: middle; }
    td.pos { font-weight: 900; text-align: center; width: 38px; font-size: 11pt; }
    td.dossard { font-weight: 700; color: #64748b; width: 52px; }
    td.nom { font-weight: 600; }
    td.temps { font-family: monospace; font-weight: 700; color: #15803d; text-align: right; width: 80px; }
    .footer { margin-top: 20px; padding-top: 8px; border-top: 1px solid #e2e8f0; font-size: 8pt; color: #94a3b8; display: flex; justify-content: space-between; }
    .no-print { padding: 12px 20px; background: #f1f5f9; display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
    @media print { .no-print { display: none !important; } tr { page-break-inside: avoid; } }
  </style>
</head><body>
  <div class="no-print">
    <strong>Classement ${escHtml(nom)}${filtreLabel}</strong>
    <button onclick="window.print()" style="padding:8px 20px;background:#15803d;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:700">
      📄 Imprimer / Enregistrer en PDF
    </button>
    <span style="font-size:.85rem;color:#64748b">Choisir "Enregistrer en PDF" dans la boîte d'impression</span>
  </div>
  <div class="header">
    <h1>🏔 Trail des Plancatges</h1>
    <h2>Classement ${escHtml(nom)}${filtreLabel}</h2>
    <div class="header-meta">
      <span>📅 <strong>${date}</strong></span>
      <span>🕐 Départ : <strong>${depart}</strong></span>
      <span>👟 ${lignesFiltrees.length} arrivées</span>
    </div>
  </div>
  <table>
    <thead><tr>
      <th>Pos.</th><th>#</th><th>Nom — Prénom</th><th>Sx</th><th>Cat.</th><th>Club</th><th>Temps</th><th>Moyenne</th>
    </tr></thead>
    <tbody>${lignesHtml}</tbody>
  </table>
  <div class="footer">
    <span>Trail des Plancatges — ${escHtml(nom)}${filtreLabel}</span>
    <span>Généré le ${date}</span>
  </div>
</body></html>`;

  const win = window.open('', '_blank');
  win.document.write(html);
  win.document.close();
  win.onload = () => win.print();
}

// Rafraîchissement auto plus rapide si course en cours
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    loadCourses();
    loadClassement();
    resetCountdown();
  }
});
</script>
</body>
</html>
